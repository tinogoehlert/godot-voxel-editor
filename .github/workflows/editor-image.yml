name: editor-image

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for the build
        type: choice
        options: [github-hosted, self-hosted]
        default: github-hosted

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/godot-voxel-editor

jobs:
  build:
    runs-on: ${{ inputs.runner == 'self-hosted' && 'self-hosted' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        if: ${{ inputs.runner != 'self-hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /
      - name: Load engine.env
        run: cat engine.env >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
        with:
          driver: ${{ inputs.runner == 'self-hosted' && 'docker' || 'docker-container' }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.editor
          target: editor
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.GODOT_TAG }}
          build-args: |
            GODOT_TAG=${{ env.GODOT_TAG }}
            VOXEL_COMMIT=${{ env.VOXEL_COMMIT }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
