name: editor-image

on:
  workflow_dispatch:
    inputs:
      init:
        description: Push only the empty :init image (to make the package public before the real push)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/godot-voxel-editor

jobs:
  init:
    if: ${{ inputs.init }}
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push empty :init image
        run: |
          printf 'FROM scratch\nLABEL org.opencontainers.image.source=%s\n' \
            "https://github.com/${{ github.repository }}" > Dockerfile.init
          docker build -f Dockerfile.init -t "${IMAGE,,}:init" .
          docker push "${IMAGE,,}:init"

  build:
    if: ${{ !inputs.init }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /
      - name: Load engine.env
        run: cat engine.env >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.editor
          target: editor
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.GODOT_TAG }}
          build-args: |
            GODOT_TAG=${{ env.GODOT_TAG }}
            VOXEL_COMMIT=${{ env.VOXEL_COMMIT }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
